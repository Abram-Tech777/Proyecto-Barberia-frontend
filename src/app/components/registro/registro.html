<div class="min-h-[70vh] flex items-center justify-center px-4 py-8">
  <div class="w-full max-w-md bg-neutral-900 border border-neutral-800 rounded-2xl p-8 shadow-xl">
    <h2 class="text-2xl font-bold text-neutral-100 mb-1">Crear cuenta</h2>
    <p class="text-neutral-400 text-sm mb-6">Regístrate como cliente para reservar tus citas.</p>

    <div *ngIf="error"
         class="mb-4 bg-red-950/60 border border-red-800 text-red-300 text-sm px-4 py-3 rounded-lg">
      {{ error }}
    </div>
    <div *ngIf="exito"
         class="mb-4 bg-green-950/60 border border-green-800 text-green-300 text-sm px-4 py-3 rounded-lg">
      {{ exito }}
    </div>

    <form (ngSubmit)="registrar()" class="space-y-4">
      <div>
        <label class="block text-sm text-neutral-300 mb-1">Nombre</label>
        <input type="text" name="nombreUsuario" [(ngModel)]="nombreUsuario" required
               placeholder="Tu nombre"
               class="w-full bg-neutral-800 border border-neutral-700 rounded-lg px-4 py-2.5 text-neutral-100 placeholder-neutral-500 focus:outline-none focus:border-amber-500">
      </div>

      <div>
        <label class="block text-sm text-neutral-300 mb-1">Correo</label>
        <input type="email" name="email" [(ngModel)]="email" required
               placeholder="tucorreo@ejemplo.com"
               class="w-full bg-neutral-800 border border-neutral-700 rounded-lg px-4 py-2.5 text-neutral-100 placeholder-neutral-500 focus:outline-none focus:border-amber-500">
      </div>

      <div>
        <label class="block text-sm text-neutral-300 mb-1">Clave</label>
        <input type="password" name="clave" [(ngModel)]="clave" required
               placeholder="Crea tu contraseña"
               class="w-full bg-neutral-800 border border-neutral-700 rounded-lg px-4 py-2.5 text-neutral-100 placeholder-neutral-500 focus:outline-none focus:border-amber-500">
      </div>

      <div>
        <label class="block text-sm text-neutral-300 mb-1">Teléfono</label>
        <input type="tel" name="telefono" [(ngModel)]="telefono" required
               placeholder="987654321"
               class="w-full bg-neutral-800 border border-neutral-700 rounded-lg px-4 py-2.5 text-neutral-100 placeholder-neutral-500 focus:outline-none focus:border-amber-500">
      </div>

      <label class="flex items-center gap-2 text-sm text-neutral-300">
        <input type="checkbox" name="recibirPromociones" [(ngModel)]="recibirPromociones"
               class="accent-amber-500">
        Quiero recibir promociones
      </label>

      <button type="submit" [disabled]="cargando"
              class="w-full bg-amber-500 hover:bg-amber-400 disabled:opacity-60 text-neutral-950 font-semibold py-2.5 rounded-lg transition-colors">
        {{ cargando ? 'Creando cuenta...' : 'Crear cuenta' }}
      </button>
    </form>

    <div class="mt-5 pt-5 border-t border-neutral-800 text-center">
      <button type="button" disabled title="Próximamente"
              class="w-full bg-neutral-800 border border-neutral-700 text-neutral-300 py-2.5 rounded-lg opacity-60 cursor-not-allowed">
        Registrarse con Google (Próximamente)
      </button>
    </div>

    <p class="mt-5 text-sm text-neutral-400 text-center">
      ¿Ya tienes cuenta?
      <a routerLink="/login" class="text-amber-500 hover:underline">Iniciar sesión</a>
    </p>
  </div>
</div>
