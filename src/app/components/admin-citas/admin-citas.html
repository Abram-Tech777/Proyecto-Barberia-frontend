<div class="min-h-[70vh] bg-paper">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 py-12">
    <div class="flex items-center justify-between mb-8">
      <div>
        <span class="text-label-caps text-gold-dark mb-2 inline-block">Administración</span>
        <h2 class="font-display text-3xl text-ink uppercase">Citas</h2>
      </div>
      <label class="flex items-center gap-2 text-sm text-muted">
        <input [(ngModel)]="soloPendientes" (ngModelChange)="cargarCitas()" type="checkbox" class="accent-gold-dark">
        Solo pendientes por validar
      </label>
    </div>

    <div *ngIf="error" class="mb-4 bg-red-50 border border-red-300 text-red-700 text-sm px-4 py-3">
      {{ error }}
    </div>
    <div *ngIf="mensaje" class="mb-4 bg-green-50 border border-green-300 text-green-700 text-sm px-4 py-3">
      {{ mensaje }}
    </div>

    <div *ngIf="cargando" class="text-center py-10 text-muted">Cargando citas...</div>

    <div *ngIf="!cargando" class="bg-paper-low border border-line-light overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="bg-line-light/40 text-muted text-left">
            <th class="px-4 py-3">#</th>
            <th class="px-4 py-3">Cliente</th>
            <th class="px-4 py-3">Celular</th>
            <th class="px-4 py-3">Barbero</th>
            <th class="px-4 py-3">Inicio</th>
            <th class="px-4 py-3">Estado</th>
            <th class="px-4 py-3">Cambiar estado</th>
            <th class="px-4 py-3 text-right">Acción</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let c of citas" class="border-t border-line-light text-ink">
            <td class="px-4 py-3">{{ c.id }}</td>
            <td class="px-4 py-3 font-medium">{{ c.nombreCliente }}</td>
            <td class="px-4 py-3">{{ c.celularCliente }}</td>
            <td class="px-4 py-3">{{ c.barbero?.nombreCompleto || '—' }}</td>
            <td class="px-4 py-3">{{ formatearFecha(c.horaInicio) }}</td>
            <td class="px-4 py-3">
              <span [ngClass]="{
                'text-amber-700': c.estado === 'PENDIENTE_VALIDAR',
                'text-sky-700': c.estado === 'CONFIRMADA',
                'text-indigo-700': c.estado === 'EN_PROCESO',
                'text-green-700': c.estado === 'COMPLETADA',
                'text-red-600': c.estado === 'CANCELADA'
              }">{{ c.estado }}</span>
            </td>
            <td class="px-4 py-3">
              <select [ngModel]="c.estado" (ngModelChange)="cambiarEstado(c, $event)"
                      class="bg-white border border-line-light rounded px-2 py-1 text-ink focus:outline-none focus:border-gold-dark">
                <option *ngFor="let e of estados" [value]="e">{{ e }}</option>
              </select>
            </td>
            <td class="px-4 py-3 text-right">
              <button (click)="eliminar(c)" class="text-red-600 hover:underline">Eliminar</button>
            </td>
          </tr>
          <tr *ngIf="citas.length === 0">
            <td colspan="8" class="px-4 py-10 text-center text-muted">No hay citas registradas.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
