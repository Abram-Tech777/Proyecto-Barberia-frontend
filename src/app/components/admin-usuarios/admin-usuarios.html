<div class="max-w-6xl mx-auto px-4 sm:px-6 py-10">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h2 class="text-2xl font-bold text-neutral-100">Gestión de usuarios</h2>
      <p class="text-neutral-400 text-sm">Asigna el cargo de cada usuario: cliente, barbero o admin.</p>
    </div>
    <button (click)="cargarUsuarios()"
            class="bg-neutral-800 hover:bg-neutral-700 text-neutral-200 text-sm px-4 py-2 rounded-lg transition-colors">
      Actualizar
    </button>
  </div>

  <div *ngIf="error"
       class="mb-4 bg-red-950/60 border border-red-800 text-red-300 text-sm px-4 py-3 rounded-lg">
    {{ error }}
  </div>
  <div *ngIf="mensaje"
       class="mb-4 bg-green-950/60 border border-green-800 text-green-300 text-sm px-4 py-3 rounded-lg">
    {{ mensaje }}
  </div>

  <div *ngIf="cargando" class="text-neutral-400 text-center py-10">Cargando usuarios...</div>

  <div *ngIf="!cargando" class="bg-neutral-900 border border-neutral-800 rounded-2xl overflow-hidden">
    <table class="w-full text-sm">
      <thead>
        <tr class="bg-neutral-800/60 text-neutral-300 text-left">
          <th class="px-4 py-3">Nombre</th>
          <th class="px-4 py-3">Correo</th>
          <th class="px-4 py-3">Teléfono</th>
          <th class="px-4 py-3">Rol actual</th>
          <th class="px-4 py-3">Nuevo cargo</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let u of usuarios" class="border-t border-neutral-800 text-neutral-200">
          <td class="px-4 py-3">{{ u.nombreUsuario || '—' }}</td>
          <td class="px-4 py-3">{{ u.email }}</td>
          <td class="px-4 py-3">{{ u.telefono || '—' }}</td>
          <td class="px-4 py-3">
            <span [ngClass]="{
              'text-amber-500': u.rol === 'ADMIN',
              'text-sky-400': u.rol === 'BARBERO',
              'text-neutral-300': u.rol === 'CLIENTE_TIENDA' || u.rol === 'CLIENTE_BOT'
            }">{{ u.rol }}</span>
          </td>
          <td class="px-4 py-3">
            <select [ngModel]="u.rol" (ngModelChange)="cambiarRol(u, $event)"
                    class="bg-neutral-800 border border-neutral-700 rounded-lg px-3 py-1.5 text-neutral-100 focus:outline-none focus:border-amber-500">
              <option *ngFor="let r of roles" [value]="r">{{ r }}</option>
            </select>
          </td>
        </tr>
        <tr *ngIf="usuarios.length === 0">
          <td colspan="5" class="px-4 py-10 text-center text-neutral-400">No hay usuarios registrados.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
